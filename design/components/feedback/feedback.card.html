<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-page)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:16px}.lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Toast, Tooltip, Dialog, Button, IconButton } = window.WarmlineDesignSystem_273f7f;
function Demo(){
  const [open,setOpen]=React.useState(false);
  return (
  <div className="stack">
    <div className="row" style={{alignItems:'flex-start'}}>
      <Toast tone="success" title="Conversation resolved" description="Fin closed it in 42 seconds." onDismiss={()=>{}} />
      <Toast tone="error" title="Message failed to send" description="Check the workspace connection." onDismiss={()=>{}} />
    </div>
    <div className="row" style={{gap:20}}>
      <Tooltip content="Assign conversation"><IconButton name="user-plus" variant="outlined" /></Tooltip>
      <Tooltip content="Snooze until tomorrow" placement="bottom"><IconButton name="clock" variant="outlined" /></Tooltip>
      <Button variant="outlined" onClick={()=>setOpen(true)}>Open dialog</Button>
      <span style={{fontSize:14,fontWeight:300,color:'var(--text-muted)'}}>Hover the icon buttons</span>
    </div>
    <Dialog open={open} title="Invite teammates" description="They'll get access to the shared Inbox and all open conversations."
      footer={<><Button variant="outlined" onClick={()=>setOpen(false)}>Cancel</Button><Button onClick={()=>setOpen(false)}>Send invites</Button></>}
      onClose={()=>setOpen(false)} />
  </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
