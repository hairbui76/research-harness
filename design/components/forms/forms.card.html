<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-page)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:16px}.lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.WarmlineDesignSystem_273f7f;
function Demo(){
  const [plan,setPlan]=React.useState('essential');
  return (
  <div className="stack">
    <div className="row" style={{alignItems:'flex-start'}}>
      <Input style={{flex:1}} label="Work email" placeholder="you@company.com" iconLeft="mail" />
      <Select style={{flex:1}} label="Assignee" options={["Unassigned","Fin","Maya R."]} />
    </div>
    <div className="row" style={{alignItems:'flex-start'}}>
      <Input style={{flex:1}} label="Seats" defaultValue="0" error="Must be at least 1" />
      <Input style={{flex:1}} label="Search" size="sm" placeholder="Search conversations" iconLeft="search" hint="Supports operators" />
    </div>
    <div className="row" style={{gap:24}}>
      <Checkbox label="Email me product updates" defaultChecked />
      <Checkbox label="Unchecked" />
      <Checkbox label="Disabled" disabled />
    </div>
    <div className="row" style={{gap:24}}>
      <Radio name="plan" value="essential" checked={plan==='essential'} onChange={()=>setPlan('essential')} label="Essential" />
      <Radio name="plan" value="advanced" checked={plan==='advanced'} onChange={()=>setPlan('advanced')} label="Advanced" />
      <Switch label="Hand off to a teammate" defaultChecked />
      <Switch label="Off" />
    </div>
  </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
