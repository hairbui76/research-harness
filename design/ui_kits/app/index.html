<!DOCTYPE html><html><head><meta charset="utf-8"><title>Warmline — helpdesk app kit</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../ds-boot.js"></script>
<style>html,body{margin:0;height:100%}body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);overflow-x:auto;overflow-y:hidden}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}#root{height:100%;min-width:1280px}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="AppChrome.jsx"></script>
<script type="text/babel" src="LoginScreen.jsx"></script>
<script type="text/babel" src="InboxScreen.jsx"></script>
<script type="text/babel" src="ReportsScreen.jsx"></script>
<script type="text/babel" src="SettingsScreen.jsx"></script>
<script type="text/babel" data-presets="react">
function App(){
  const [signedIn, setSignedIn] = React.useState(false);
  const [route, setRoute] = React.useState("inbox");
  if (!signedIn) return <LoginScreen onSignIn={() => setSignedIn(true)} />;
  return (
    <div style={{display:"flex",height:"100vh",minWidth:1280,overflow:"hidden"}}>
      <Rail route={route} onRoute={setRoute} onSignOut={() => setSignedIn(false)} />
      {route === "inbox" && <InboxScreen />}
      {route === "reports" && <ReportsScreen />}
      {route === "settings" && <SettingsScreen />}
    </div>
  );
}
window.__dsReady.then(() => ReactDOM.createRoot(document.getElementById("root")).render(<App />));
</script></body></html>
