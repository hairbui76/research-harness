<!DOCTYPE html><html><head><meta charset="utf-8"><title>Warmline — marketing site kit</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../ds-boot.js"></script>
<style>body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="ProductScreen.jsx"></script>
<script type="text/babel" src="PricingScreen.jsx"></script>
<script type="text/babel" src="ArticleScreen.jsx"></script>
<script type="text/babel" data-presets="react">
function Site(){
  const [route, setRoute] = React.useState("home");
  const go = (r) => { setRoute(r); window.scrollTo(0, 0); };
  return (<>
    <Nav route={route} onRoute={go} />
    {route === "home" && <HomeScreen onRoute={go} />}
    {route === "product" && <ProductScreen onRoute={go} />}
    {(route === "pricing" || route === "solutions" || route === "docs") && <PricingScreen />}
    {route === "article" && <ArticleScreen />}
    <Footer />
  </>);
}
window.__dsReady.then(() => ReactDOM.createRoot(document.getElementById("root")).render(<Site />));
</script></body></html>
