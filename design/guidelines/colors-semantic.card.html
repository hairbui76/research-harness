<!-- @dsCard group="Colors" viewport="700x150" name="Semantic + press" subtitle="Feedback tones and the green active state" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.g{display:flex;gap:12px;align-items:stretch}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;padding:10px;border-radius:var(--radius-card);border:1px solid var(--border-default)}.n{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;line-height:1.3}.h{font-size:11px;font-family:var(--font-mono);letter-spacing:.6px;opacity:.6;line-height:1.3}.r{display:flex;align-items:baseline;gap:14px}.meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-tertiary);white-space:nowrap}</style></head><body><div class="g">
<div class="sw" style="background:var(--feedback-success);color:var(--text-primary);border:1px solid var(--border-default)"><div class="n">Success</div><div class="h">--feedback-success</div></div>
<div class="sw" style="background:var(--feedback-info);color:var(--text-primary);border:1px solid var(--border-default)"><div class="n">Info</div><div class="h">--feedback-info</div></div>
<div class="sw" style="background:var(--feedback-warning);color:var(--color-white);border:1px solid #fe4c02"><div class="n">Warning</div><div class="h">--feedback-warning</div></div>
<div class="sw" style="background:var(--feedback-error);color:var(--color-white);border:1px solid #c41c1c"><div class="n">Error</div><div class="h">--feedback-error</div></div>
<div class="sw" style="background:var(--color-active-green);color:var(--color-white);border:1px solid #2c6415"><div class="n">Press Green</div><div class="h">#2c6415</div></div>
<div class="sw" style="background:var(--color-deep-blue);color:var(--color-white);border:1px solid #0007cb"><div class="n">Deep Blue</div><div class="h">#0007cb</div></div>
</div></body></html>
