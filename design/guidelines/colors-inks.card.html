<!-- @dsCard group="Colors" viewport="700x150" name="Translucent inks" subtitle="oklab-based ink washes for borders, scrims and hovers" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.g{display:flex;gap:12px;align-items:stretch}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;padding:10px;border-radius:var(--radius-card);border:1px solid var(--border-default)}.n{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;line-height:1.3}.h{font-size:11px;font-family:var(--font-mono);letter-spacing:.6px;opacity:.6;line-height:1.3}.r{display:flex;align-items:baseline;gap:14px}.meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-tertiary);white-space:nowrap}</style></head><body><div class="g" style="background:var(--color-cream);border-radius:var(--radius-card)">
<div class="sw" style="background:var(--ink-10);color:var(--text-primary);border:1px solid var(--border-default)"><div class="n">Ink 10</div><div class="h">oklab(.15 0 0 / .1)</div></div>
<div class="sw" style="background:var(--ink-14);color:var(--text-primary);border:1px solid var(--border-default)"><div class="n">Ink 14</div><div class="h">oklab(.15 0 0 / .14)</div></div>
<div class="sw" style="background:var(--ink-30);color:var(--color-white);border:1px solid var(--border-default)"><div class="n">Ink 30</div><div class="h">oklab(.15 0 0 / .3)</div></div>
<div class="sw" style="background:var(--ink-60);color:var(--color-white);border:1px solid var(--border-default)"><div class="n">Ink 60</div><div class="h">oklab(.15 0 0 / .6)</div></div>
</div></body></html>
