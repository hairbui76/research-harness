<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.g{display:flex;gap:12px;align-items:stretch}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;padding:10px;border-radius:var(--radius-card);border:1px solid var(--border-default)}.n{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;line-height:1.3}.h{font-size:11px;font-family:var(--font-mono);letter-spacing:.6px;opacity:.6;line-height:1.3}.r{display:flex;align-items:baseline;gap:14px}.meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-tertiary);white-space:nowrap}</style></head><body><div class="g">
<div class="sw" style="background:var(--color-report-blue);color:var(--text-primary);border:1px solid var(--border-default)"><div class="n">Blue</div><div class="h">#65b5ff</div></div>
<div class="sw" style="background:var(--color-report-green);color:var(--text-primary);border:1px solid var(--border-default)"><div class="n">Green</div><div class="h">#0bdf50</div></div>
<div class="sw" style="background:var(--color-report-lime);color:var(--text-primary);border:1px solid var(--border-default)"><div class="n">Lime</div><div class="h">#b3e01c</div></div>
<div class="sw" style="background:var(--color-report-orange);color:var(--color-white);border:1px solid #fe4c02"><div class="n">Orange</div><div class="h">#fe4c02</div></div>
<div class="sw" style="background:var(--color-report-pink);color:var(--color-white);border:1px solid #ff2067"><div class="n">Pink</div><div class="h">#ff2067</div></div>
<div class="sw" style="background:var(--color-report-red);color:var(--color-white);border:1px solid #c41c1c"><div class="n">Red</div><div class="h">#c41c1c</div></div>
</div></body></html>
