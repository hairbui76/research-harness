<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.g{display:flex;gap:12px;align-items:stretch}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;padding:10px;border-radius:var(--radius-card);border:1px solid var(--border-default)}.n{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;line-height:1.3}.h{font-size:11px;font-family:var(--font-mono);letter-spacing:.6px;opacity:.6;line-height:1.3}.r{display:flex;align-items:baseline;gap:14px}.meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-tertiary);white-space:nowrap}</style><style>.b{height:40px;padding:0 14px;display:inline-flex;align-items:center;border-radius:4px;font-size:16px;border:1px solid #111;background:#111;color:#fff}</style></head><body>
<div style="display:flex;gap:40px;align-items:center;padding:16px 0">

<div style="text-align:center"><span class="b" style="background:#fff;color:#111;transform:scale(1.1)">Hover</span><div class="meta" style="margin-top:12px">scale(1.1) · inverts</div></div>
<div style="text-align:center"><span class="b" style="background:var(--color-active-green);border-color:var(--color-active-green);transform:scale(.85)">Press</span><div class="meta" style="margin-top:12px">scale(0.85) · green</div></div>
</div>
<div class="meta">120ms · cubic-bezier(0.22, 1, 0.36, 1)</div></body></html>
