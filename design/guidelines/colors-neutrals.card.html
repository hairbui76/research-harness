<!-- @dsCard group="Colors" viewport="700x150" name="Warm neutrals" subtitle="Every grey is warm — never cool" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.g{display:flex;gap:12px;align-items:stretch}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;padding:10px;border-radius:var(--radius-card);border:1px solid var(--border-default)}.n{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;line-height:1.3}.h{font-size:11px;font-family:var(--font-mono);letter-spacing:.6px;opacity:.6;line-height:1.3}.r{display:flex;align-items:baseline;gap:14px}.meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-tertiary);white-space:nowrap}</style></head><body><div class="g">
<div class="sw" style="background:var(--color-black-80);color:var(--color-white);border:1px solid #313130"><div class="n">Black 80</div><div class="h">#313130</div></div>
<div class="sw" style="background:var(--color-black-60);color:var(--color-white);border:1px solid #626260"><div class="n">Black 60</div><div class="h">#626260</div></div>
<div class="sw" style="background:var(--color-black-50);color:var(--color-white);border:1px solid #7b7b78"><div class="n">Black 50</div><div class="h">#7b7b78</div></div>
<div class="sw" style="background:var(--color-content-tertiary);color:var(--color-white);border:1px solid #9c9fa5"><div class="n">Tertiary</div><div class="h">#9c9fa5</div></div>
<div class="sw" style="background:var(--color-sand);color:var(--text-primary);border:1px solid var(--border-default)"><div class="n">Warm Sand</div><div class="h">#d3cec6</div></div>
<div class="sw" style="background:var(--color-oat);color:var(--text-primary);border:1px solid var(--border-default)"><div class="n">Oat Border</div><div class="h">#dedbd6</div></div>
</div></body></html>
