name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The gate runs every suite and then the browser suite against the real daemon. The
    # Windows runner takes half an hour to reach the browser step and three quarters of an
    # hour to run it, and the whole job has to fit under this.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The gate's own per-check limit defaults to 1200s, which the browser suite exceeds on
      # the Windows runner (about 45 minutes) and approaches on Ubuntu (about 16).
      - run: pnpm run task:check --timeout 3600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: .task-gate/
          include-hidden-files: true
          retention-days: 7
